name: BuildDocs

# Ported from main's identical workflow (same job structure, same Pages
# target). Known, accepted risk: `main` has its own copy of this workflow,
# also deploying to the same repo's single GitHub Pages site - whichever
# branch pushes to docs/** most recently wins the live deployment. Not
# reconciled here; see docs/README.md.
on:
  push:
    branches: [v4]
    paths:
      - "docs/**"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push should win over a still-
# running older one rather than queue behind it. Shared "pages" group with
# main's own BuildDocs workflow too - both branches ultimately race for the
# same Pages deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs
      - name: Build with Jekyll
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Older toolchain (electron-forge 5 / Electron 4). Node 16 matches what the
# project builds with locally; CI installs with --ignore-engines like the old
# CircleCI config did.
env:
  NODE_VERSION: "16"
  # Belt-and-suspenders for the CLI --ignore-engines below: this is inherited by
  # the nested `yarn install` electron-packager runs while pruning the packaged
  # app, which otherwise chokes on modern transitive deps that require Node >=18
  # (e.g. node-releases, via a fresh browserslist resolve). We build on 16 on
  # purpose. A repo-root .yarnrc sets the same thing for local dev.
  YARN_IGNORE_ENGINES: "true"

# The three desktop builds run strictly one after another - Windows, then macOS,
# then Linux - via the `needs` chain below. `build-macos` is still kept
# `continue-on-error` and `build-linux` runs with `if: always()`, so a macOS
# runner hiccup (the retired `macos-13` label used to hang here forever) delays
# Linux by no more than GitHub's queue give-up and never fails the run. The repo
# is public, so macOS runner minutes are free.
#
# No automatic GitHub Release: this workflow only builds + packages each
# platform and uploads the results as workflow artifacts (see each
# `actions/upload-artifact` step) - publishing a release is now a separate,
# deliberate manual step, not something a tag push triggers on its own.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --ignore-engines --network-timeout 600000
      - run: yarn test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --ignore-engines --network-timeout 600000
      - name: Package + make (windows-x64)
        run: yarn make:win
        env:
          CI: "true" # forge.config.js skips osxSign when set
      - uses: actions/upload-artifact@v4
        with:
          name: gbsnes-studio-windows-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: build-windows
    # macos-15 is an arm64 runner (macos-13, the last Intel image, was retired
    # by GitHub in 2025). Electron 4 has no darwin-arm64 build, and
    # electron-prebuilt-compile's postinstall downloads Electron for the host
    # arch - so we install an x64 Node (Rosetta 2 is on the arm64 runners) and
    # force npm's target arch to x64. Every Electron download tool then fetches
    # darwin-x64, and electron-packager --arch=x64 packages an Intel app.
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 120
    env:
      npm_config_arch: x64
      npm_config_target_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          cache: yarn
      - run: yarn install --ignore-engines --network-timeout 600000
      - name: Package + make (macos-x64)
        run: yarn make:mac
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: gbsnes-studio-macos-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  build-linux:
    # Chained after macOS (build-macos already waits for Windows), but listed
    # both so the `if` can read Windows's result.
    needs: [build-windows, build-macos]
    # Runs once macOS reaches a terminal state (success, failure, or cancelled),
    # as long as Windows actually succeeded - macOS is not allowed to block it.
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm
      - run: yarn install --ignore-engines --network-timeout 600000
      - name: Package + make (linux-x64)
        run: yarn make:linux
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: gbsnes-studio-linux-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

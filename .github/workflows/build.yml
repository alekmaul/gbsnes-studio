name: Build

on:
  push:
    # `v2` is the last dual-target release (frozen at v2.0.0); `v3` is the
    # active GB-removal branch (see the roadmap artifact, M14-M18) - this
    # workflow itself was copied over from `main` early on (M2) but never
    # actually triggered on `v2` pushes until M12, so none of the packaging
    # changes since had ever run through real CI. Same story again for `v3`
    # (found at M18 - `v3` was simply never added here, so every push since
    # the branch was created had silently never run CI). All three branches
    # build the same way (Windows -> macOS -> Linux, same makers), just on
    # different Electron/electron-forge versions.
    branches: [main, v2, v3]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# `main` is pinned to electron-forge 5 / Electron 4; `v2` to electron-forge 6
# (beta) / Electron 8 - neither needs a newer Node than 16 to build, so one
# pin covers both. Node 16 matches what the project builds with locally; CI
# installs with --ignore-engines like the old CircleCI config did.
env:
  NODE_VERSION: "16"
  # Belt-and-suspenders for the CLI --ignore-engines below: this is inherited by
  # the nested `yarn install` electron-packager runs while pruning the packaged
  # app, which otherwise chokes on modern transitive deps that require Node >=18
  # (e.g. node-releases, via a fresh browserslist resolve). We build on 16 on
  # purpose. A repo-root .yarnrc sets the same thing for local dev.
  YARN_IGNORE_ENGINES: "true"

# The three desktop builds run strictly one after another - Windows, then macOS,
# then Linux - via the `needs` chain below. `build-macos` is still kept
# `continue-on-error` and `build-linux` runs with `if: always()`, so a macOS
# runner hiccup (the retired `macos-13` label used to hang here forever) delays
# Linux by no more than GitHub's queue give-up and never fails the run or the
# release. `release` gates on Windows + Linux only; the macOS .zip is attached
# if present. The repo is public, so macOS runner minutes are free.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --ignore-engines --network-timeout 600000
      - run: yarn test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --ignore-engines --network-timeout 600000
      - name: Package + make (windows-x64)
        run: yarn make:win
        env:
          CI: "true" # forge.config.js skips osxSign when set
      - uses: actions/upload-artifact@v4
        with:
          name: snes-studio-windows-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: build-windows
    # macos-15 is an arm64 runner (macos-13, the last Intel image, was retired
    # by GitHub in 2025). Neither branch's pinned Electron (4 on `main`, 8 on
    # `v2` - Apple Silicon support landed in Electron 11) has a native
    # darwin-arm64 build, and the Electron npm package's own postinstall
    # downloads a binary for the host arch - so we install an x64 Node
    # (Rosetta 2 is on the arm64 runners) and force npm's target arch to x64.
    # Every Electron download then fetches darwin-x64, and electron-packager
    # --arch=x64 packages an Intel app.
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 120
    env:
      npm_config_arch: x64
      npm_config_target_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          cache: yarn
      - run: yarn install --ignore-engines --network-timeout 600000
      - name: Package + make (macos-x64)
        run: yarn make:mac
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: snes-studio-macos-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  build-linux:
    # Chained after macOS (build-macos already waits for Windows), but listed
    # both so the `if` can read Windows's result.
    needs: [build-windows, build-macos]
    # Runs once macOS reaches a terminal state (success, failure, or cancelled),
    # as long as Windows actually succeeded - macOS is not allowed to block it.
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm
      - run: yarn install --ignore-engines --network-timeout 600000
      - name: Package + make (linux-x64)
        run: yarn make:linux
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: snes-studio-linux-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  # On a v* tag: collect whatever per-platform builds are available and attach
  # them to the release. Fires as soon as Windows + Linux succeed; macOS is
  # optional - `always()` lets this run even when that job failed, was
  # cancelled, or never got a runner, and download-artifact +
  # fail_on_unmatched_files: false tolerate the missing macOS asset.
  release:
    needs: [build-windows, build-macos, build-linux]
    if: >-
      ${{ always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build-windows.result == 'success'
      && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false

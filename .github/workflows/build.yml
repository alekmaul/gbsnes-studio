name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Older toolchain (electron-forge 5 / Electron 4). Node 16 matches what the
# project builds with locally; CI installs with --ignore-engines like the old
# CircleCI config did.
env:
  NODE_VERSION: "16"
  # Belt-and-suspenders for the CLI --ignore-engines below: this is inherited by
  # the nested `yarn install` electron-packager runs while pruning the packaged
  # app, which otherwise chokes on modern transitive deps that require Node >=18
  # (e.g. node-releases, via a fresh browserslist resolve). We build on 16 on
  # purpose. A repo-root .yarnrc sets the same thing for local dev.
  YARN_IGNORE_ENGINES: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --ignore-engines --network-timeout 600000
      - run: yarn test

  # Linux, then Windows - one at a time (max-parallel: 1), in that order.
  # These two gate the release.
  build:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            make: make:linux
            artifact: linux-x64
          - os: windows-latest
            make: make:win
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Linux packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm

      - run: yarn install --ignore-engines --network-timeout 600000

      - name: Package + make (${{ matrix.artifact }})
        run: yarn ${{ matrix.make }}
        env:
          CI: "true" # forge.config.js skips osxSign when set

      - uses: actions/upload-artifact@v4
        with:
          name: gbsnes-studio-${{ matrix.artifact }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  # macOS runs last and on its own. This repo is private, where GitHub bills
  # macOS runners at 10x the minute rate; if the account is over its limit the
  # job just sits "waiting for a runner". Keeping it out of the `build` matrix -
  # and only a soft dependency of `release` (continue-on-error + the release's
  # `always()` gate) - means a stuck or failed macOS build never blocks the
  # Windows + Linux release. The macOS .zip is attached when the job does run.
  build-macos:
    needs: build
    runs-on: macos-13 # x64 runner — Electron 4 has no arm64 build
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --ignore-engines --network-timeout 600000

      - name: Package + make (macos-x64)
        run: yarn make:mac
        env:
          CI: "true" # forge.config.js skips osxSign when set

      - uses: actions/upload-artifact@v4
        with:
          name: gbsnes-studio-macos-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  # On a v* tag: collect whatever per-platform builds are available and attach
  # them to the release. Runs as soon as Windows + Linux succeed; macOS is
  # optional (see build-macos) - `always()` lets this run even when that job
  # failed, was cancelled, or never got a runner, and download-artifact +
  # fail_on_unmatched_files: false tolerate the missing macOS asset.
  release:
    needs: [build, build-macos]
    if: >-
      ${{ always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
